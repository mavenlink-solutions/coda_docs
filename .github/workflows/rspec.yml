name: Tests

on: [pull_request]

env:
  BUNDLER_VERSION: 2.5.23

jobs:
  rspec:
    runs-on: ubuntu-latest
    environment: test
    container:
      image: ruby:3.0.6

    steps:
      - uses: actions/checkout@v4

      - name: Gem cache
        id: cache-bundle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ hashFiles('**/Gemfile.lock') }}

      - name: Bundle install
        env:
          RAILS_ENV: test
        run: |
          gem install bundler -v "$BUNDLER_VERSION"
          bundle "_${BUNDLER_VERSION}_" install
          
      - name: Run tests
        env:
          RAILS_ENV: test
          CODA_DOCS_API_KEY: pretend_api_key
        run: |
          bundle "_${BUNDLER_VERSION}_" exec rspec
